<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Model - RupX</title>
    <link rel="stylesheet" href="/dashboard/dashboard-styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7"></script>
</head>
<body>
    <div class="dashboard-container">
        <nav class="sidebar">
            <div class="sidebar-brand">
                <span class="logo-icon"><img src="../landing/RupX_Logo.png" alt="RupX Logo"></span>
                <span class="logo-text">RupX</span>
            </div>
            <div class="sidebar-menu">
                <a href="/dashboard/projects.html" class="menu-item"><span>📁</span> Projects</a>
                <a href="/dashboard/upload.html" class="menu-item"><span>📤</span> Upload Dataset</a>
                <a href="/dashboard/train.html" class="menu-item active"><span>🧠</span> Train Model</a>
                <a href="/dashboard/test.html" class="menu-item"><span>🎥</span> Test Recognition</a>
                <a href="/dashboard/attendance.html" class="menu-item"><span>📊</span> Attendance</a>
            </div>
            <div class="sidebar-footer">
                <button onclick="logout()" class="btn-logout">Logout</button>
            </div>
        </nav>
        
        <main class="main-content">
            <header class="content-header">
                <h1>Train Face Recognition Model</h1>
            </header>
            
            <div id="model-status-card" class="stats-grid" style="max-width: 800px;">
                </div>
            
            <div id="training-controls" style="max-width: 800px; margin-top: 2rem;">
                <button id="train-btn" class="btn-primary" style="display: none;">
                    🚀 Start Training
                </button>
            </div>
            
            <div id="training-progress" class="progress-container" style="display: none; max-width: 800px; margin-top: 2rem; background: var(--bg-card); padding: 2rem; border-radius: 16px;">
                <h3 id="progress-title">Training in Progress...</h3>
                <div class="progress-bar" style="width: 100%; background: #333; height: 10px; border-radius: 5px; margin: 10px 0;">
                    <div id="progress-fill" style="width: 0%; height: 100%; background: #ff7849; border-radius: 5px; transition: width 0.3s;"></div>
                </div>
                <div id="progress-text" style="color: var(--text-secondary); font-size: 0.875rem;">0%</div>
                
                <div id="training-stats" style="margin-top: 1.5rem; display: none; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));">
                    </div>
            </div>
        </main>
    </div>

    

    <script src="/dashboard/dashboard.js"></script>
    <script src="/dashboard/ml-client.js"></script>
    <script src="/dashboard/train.js"></script>
</body>
</html>
